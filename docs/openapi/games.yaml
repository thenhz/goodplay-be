# Game Engine & Session Management API (GOO-8 & GOO-9)
# This module contains game engine, sessions, challenges, teams, and tournaments

openapi: 3.1.0

info:
  title: GoodPlay Games & Sessions API
  version: 1.0.0
  description: Game engine, session management, and synchronization system

# API Paths
paths:
  # Game Management
  /api/games:
    get:
      tags:
        - Games
      summary: Get games list
      description: Retrieve list of available games with filtering and pagination
      parameters:
        - name: active_only
          in: query
          schema:
            type: boolean
            default: true
          description: Filter to show only active games
        - name: category
          in: query
          schema:
            type: string
          description: Filter by game category
        - name: page
          in: query
          schema:
            type: integer
            default: 1
          description: Page number (1-indexed)
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
          description: Number of games per page
        - name: sort_by
          in: query
          schema:
            type: string
            enum: [created_at, rating, install_count, name]
            default: created_at
          description: Field to sort results by
      responses:
        '200':
          description: Games retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/GamesList'
        '400':
          description: Invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              examples:
                invalidPage:
                  value:
                    success: false
                    message: "INVALID_PAGE_NUMBER"
                invalidLimit:
                  value:
                    success: false
                    message: "INVALID_LIMIT_VALUE"
                invalidSort:
                  value:
                    success: false
                    message: "INVALID_SORT_FIELD"
        '500':
          description: Internal server error

  /api/games/{game_id}:
    get:
      tags:
        - Games
      summary: Get game details
      description: Retrieve detailed information about a specific game
      security:
        - bearerAuth: []
      parameters:
        - name: game_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Game information retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/GameDetails'

  /api/games/search:
    get:
      tags:
        - Games
      summary: Search games
      description: Search games by name or description with query string
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
          description: Search query string
        - name: active_only
          in: query
          schema:
            type: boolean
            default: true
          description: Only search active games
      responses:
        '200':
          description: Search results retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/GamesList'
        '400':
          description: Invalid search query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              examples:
                queryRequired:
                  value:
                    success: false
                    message: "SEARCH_QUERY_REQUIRED"
        '500':
          description: Internal server error

  /api/games/categories:
    get:
      tags:
        - Games
      summary: Get game categories
      description: Retrieve list of all game categories
      responses:
        '200':
          description: Game categories retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/GameCategories'
        '500':
          description: Internal server error

  /api/games/stats:
    get:
      tags:
        - Games
      summary: Get games statistics
      description: Retrieve global statistics about games (total games, popular games, etc.)
      responses:
        '200':
          description: Games statistics retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          total_games:
                            type: integer
                          active_games:
                            type: integer
                          total_sessions:
                            type: integer
                          most_popular_game:
                            type: object
                            properties:
                              game_id:
                                type: string
                              name:
                                type: string
                              session_count:
                                type: integer
        '500':
          description: Internal server error

  # Game Plugin Management (Admin only)
  /api/games/install:
    post:
      tags:
        - Games
        - Admin
      summary: Install game plugin
      description: Install a new game plugin (admin only)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - plugin_file
              properties:
                plugin_file:
                  type: string
                  format: binary
                  description: Game plugin file to upload
                plugin_id:
                  type: string
                  description: Optional plugin ID
      responses:
        '201':
          description: Plugin installed successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          game_id:
                            type: string
                          plugin_id:
                            type: string
        '400':
          description: Invalid plugin file
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              examples:
                fileRequired:
                  value:
                    success: false
                    message: "PLUGIN_FILE_REQUIRED"
                fileEmpty:
                  value:
                    success: false
                    message: "PLUGIN_FILE_EMPTY"
        '401':
          description: Unauthorized
        '403':
          description: Admin access required
        '500':
          description: Internal server error

  /api/games/{game_id}/uninstall:
    delete:
      tags:
        - Games
        - Admin
      summary: Uninstall game plugin
      description: Uninstall a game plugin (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: game_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Plugin uninstalled successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '404':
          description: Game not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                success: false
                message: "GAME_NOT_FOUND"
        '401':
          description: Unauthorized
        '403':
          description: Admin access required
        '500':
          description: Internal server error

  /api/games/{game_id}/validate:
    post:
      tags:
        - Games
        - Admin
      summary: Validate game plugin
      description: Validate a game plugin configuration and structure (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: game_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Plugin validated successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          is_valid:
                            type: boolean
                          validation_errors:
                            type: array
                            items:
                              type: string
        '404':
          description: Game not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                success: false
                message: "GAME_NOT_FOUND"
        '401':
          description: Unauthorized
        '403':
          description: Admin access required
        '500':
          description: Internal server error

  /api/games/{game_id}/rate:
    post:
      tags:
        - Games
      summary: Rate a game
      description: Submit a rating for a game (authenticated users only)
      security:
        - bearerAuth: []
      parameters:
        - name: game_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - rating
              properties:
                rating:
                  type: number
                  format: float
                  minimum: 1.0
                  maximum: 5.0
                  description: Rating value between 1.0 and 5.0
                  example: 4.5
      responses:
        '200':
          description: Game rated successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          game_id:
                            type: string
                          new_average_rating:
                            type: number
                          rating_count:
                            type: integer
        '400':
          description: Invalid rating
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              examples:
                ratingRequired:
                  value:
                    success: false
                    message: "RATING_REQUIRED"
                invalidRating:
                  value:
                    success: false
                    message: "INVALID_RATING_VALUE"
        '404':
          description: Game not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                success: false
                message: "GAME_NOT_FOUND"
        '401':
          description: Unauthorized
        '500':
          description: Internal server error

  # Game Sessions
  /api/games/sessions:
    post:
      tags:
        - Game Sessions
      summary: Start game session
      description: Start a new game session with full game details
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - game_id
              properties:
                game_id:
                  type: string
                  description: Plugin ID of the game to start
                  example: "tic_tac_toe"
                session_config:
                  type: object
                  additionalProperties: true
                  description: Optional game-specific configuration
                device_id:
                  type: string
                  description: Device identifier (can be in device_info or root level)
                device_type:
                  type: string
                  enum: [mobile, tablet, desktop, web]
                  description: Type of device
                app_version:
                  type: string
                  description: Application version
                platform:
                  type: string
                  description: Platform name (iOS, Android, Web, etc.)
                os_version:
                  type: string
                  description: Operating system version
                device_model:
                  type: string
                  description: Device model name
                device_manufacturer:
                  type: string
                  description: Device manufacturer
                device_info:
                  type: object
                  description: Alternative way to provide device information as nested object
                  additionalProperties: true
      responses:
        '201':
          description: Game session started successfully (may have auto-abandoned previous session)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      message:
                        type: string
                        enum: [GAME_SESSION_STARTED_SUCCESS, GAME_SESSION_STARTED_PREVIOUS_ABANDONED]
                        description: |
                          - GAME_SESSION_STARTED_SUCCESS: New session started
                          - GAME_SESSION_STARTED_PREVIOUS_ABANDONED: New session started, previous active session was auto-abandoned
                      data:
                        type: object
                        required:
                          - session
                          - game
                        properties:
                          session:
                            $ref: '#/components/schemas/GameSession'
                            description: The newly created game session
                          game:
                            $ref: '#/components/schemas/GameDetails'
                            description: Game information
                          abandoned_session:
                            $ref: '#/components/schemas/GameSession'
                            nullable: true
                            description: The previous session that was auto-abandoned (only present if GAME_SESSION_STARTED_PREVIOUS_ABANDONED)
              example:
                success: true
                message: "GAME_SESSION_STARTED_SUCCESS"
                data:
                  session:
                    id: "68f89782c6046b4e6527c693"
                    session_id: "7bd30624-6834-4729-ad75-e66e9c6377ba"
                    user_id: "68e02e67e7c00626ed6a2f19"
                    game_id: "tic_tac_toe"
                    status: "active"
                    current_state: {}
                    score: null
                    started_at: "2025-10-22T08:36:17.634555+00:00"
                    play_duration_ms: 0
                  game:
                    id: "68f76f2424030789b6b138d0"
                    name: "TIC_TAC_TOE"
                    plugin_id: "tic_tac_toe"
                    category: "strategy"
                    is_active: true
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              examples:
                gameIdRequired:
                  value:
                    success: false
                    message: "GAME_ID_REQUIRED"
                gameNotFound:
                  value:
                    success: false
                    message: "GAME_NOT_FOUND"
                gameNotActive:
                  value:
                    success: false
                    message: "GAME_NOT_ACTIVE"
                pluginNotFound:
                  value:
                    success: false
                    message: "GAME_PLUGIN_NOT_FOUND"
        '401':
          description: Unauthorized
        '500':
          description: Internal server error

    get:
      tags:
        - Game Sessions
      summary: Get user sessions
      description: Retrieve user's game sessions with filtering
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [active, paused, completed, abandoned]
        - name: game_id
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: User sessions retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SessionsList'

  /api/games/sessions/stats:
    get:
      tags:
        - Game Sessions
      summary: Get user session statistics
      description: Retrieve statistical information about user's game sessions
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Session statistics retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/UserSessionStatistics'
        '401':
          description: Authentication required

  /api/games/sessions/{session_id}:
    get:
      tags:
        - Game Sessions
      summary: Get session details
      description: Retrieve detailed information about a game session including game details
      security:
        - bearerAuth: []
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Session information retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        required:
                          - session
                          - game
                        properties:
                          session:
                            $ref: '#/components/schemas/GameSession'
                          game:
                            anyOf:
                              - $ref: '#/components/schemas/GameDetails'
                              - type: "null"
        '403':
          description: User does not own this session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                success: false
                message: "SESSION_ACCESS_DENIED"
        '404':
          description: Session not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                success: false
                message: "SESSION_NOT_FOUND"
        '401':
          description: Unauthorized
        '500':
          description: Internal server error

    delete:
      tags:
        - Game Sessions
      summary: End game session
      description: End an active game session
      security:
        - bearerAuth: []
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                final_score:
                  type: integer
                end_reason:
                  type: string
                  enum: [completed, abandoned, timeout]
      responses:
        '200':
          description: Game session ended successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/GameSession'

  /api/games/sessions/{session_id}/state:
    put:
      tags:
        - Game Sessions
      summary: Update session state
      description: Update the game state of an active session
      security:
        - bearerAuth: []
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - state
              properties:
                state:
                  type: object
                  additionalProperties: true
                  description: Game-specific state data
      responses:
        '200':
          description: Session state updated successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/GameSession'
        '400':
          description: Invalid state data or session not active
        '403':
          description: User does not own this session
        '404':
          description: Session not found

  /api/games/sessions/{session_id}/moves:
    post:
      tags:
        - Game Sessions
      summary: Validate and record move
      description: Validate a game move and record it in the session
      security:
        - bearerAuth: []
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - move
              properties:
                move:
                  type: object
                  additionalProperties: true
                  description: Game-specific move data
      responses:
        '200':
          description: Move validated and recorded successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          move_valid:
                            type: boolean
                            description: Whether the move was valid
                            example: true
                          move_number:
                            type: integer
                            description: The move number in the game sequence
                            example: 5
                          session:
                            $ref: '#/components/schemas/GameSession'
              examples:
                ticTacToeMove:
                  summary: Tic Tac Toe move example
                  value:
                    success: true
                    message: "MOVE_VALIDATED_SUCCESS"
                    data:
                      move_valid: true
                      move_number: 5
                      session:
                        id: "507f1f77bcf86cd799439011"
                        session_id: "a1b2c3d4-e5f6-4a5b-8c9d-0e1f2a3b4c5d"
                        user_id: "507f1f77bcf86cd799439012"
                        game_id: "tic_tac_toe"
                        status: "active"
                        current_state:
                          board: [["X", "O", "X"], ["O", "X", null], [null, null, "O"]]
                          current_player: "X"
                          game_mode: "vs_ai"
                          player_symbol: "X"
                          moves_history:
                            - player: "X"
                              position: [0, 0]
                              move_number: 1
                            - player: "O"
                              position: [1, 0]
                              move_number: 2
                          game_over: false
                          winner: null
                          is_draw: false
                          winning_line: null
                          move_count: 5
                        score: null
                        credits_earned: null
                        started_at: "2025-10-22T10:30:00.000Z"
                        ended_at: null
                        moves_count: 5
                        achievements_unlocked: []
                        statistics: {}
                        duration_seconds: 120
                        play_duration_ms: 120000
                        play_duration_seconds: 120
                winningMove:
                  summary: Winning move example (Tic Tac Toe)
                  value:
                    success: true
                    message: "MOVE_VALIDATED_SUCCESS"
                    data:
                      move_valid: true
                      move_number: 5
                      session:
                        id: "507f1f77bcf86cd799439011"
                        session_id: "a1b2c3d4-e5f6-4a5b-8c9d-0e1f2a3b4c5d"
                        user_id: "507f1f77bcf86cd799439012"
                        game_id: "tic_tac_toe"
                        status: "active"
                        current_state:
                          board: [["X", "O", "X"], ["O", "X", "O"], ["X", null, null]]
                          current_player: "X"
                          game_mode: "vs_ai"
                          player_symbol: "X"
                          game_over: true
                          winner: "X"
                          is_draw: false
                          winning_line: [[0, 0], [1, 1], [2, 0]]
                          move_count: 5
                        score: null
                        credits_earned: null
                        started_at: "2025-10-22T10:30:00.000Z"
                        moves_count: 5
        '400':
          description: Invalid move data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              examples:
                moveDataRequired:
                  value:
                    success: false
                    message: "MOVE_DATA_REQUIRED"
                invalidMove:
                  value:
                    success: false
                    message: "INVALID_MOVE"
        '403':
          description: User does not own this session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              examples:
                accessDenied:
                  value:
                    success: false
                    message: "SESSION_ACCESS_DENIED"
        '404':
          description: Session not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              examples:
                sessionNotFound:
                  value:
                    success: false
                    message: "SESSION_NOT_FOUND"

  /api/games/sessions/{session_id}/pause:
    post:
      tags:
        - Game Sessions
      summary: Pause game session
      description: |
        Pause an active game session. Returns the complete session object with current_state
        synced from the plugin.
      security:
        - bearerAuth: []
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Session paused successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          session:
                            $ref: '#/components/schemas/GameSession'
              examples:
                ticTacToePaused:
                  value:
                    success: true
                    message: "SESSION_PAUSED_SUCCESS"
                    data:
                      session:
                        session_id: "507f1f77bcf86cd799439011"
                        game_id: "tic_tac_toe"
                        user_id: "507f191e810c19729de860ea"
                        status: "paused"
                        current_state:
                          board: [["X", "O", null], [null, "X", null], [null, null, "O"]]
                          current_player: "X"
                          game_mode: "vs_ai"
                          player_symbol: "X"
                          game_over: false
                          winner: null
                          is_draw: false
                          winning_line: null
                          move_count: 4
                        moves_count: 4
                        score: 0
                        credits_earned: 0
                        started_at: "2025-10-22T10:30:00.000000+00:00"
                        paused_at: "2025-10-22T10:35:00.000000+00:00"
                        created_at: "2025-10-22T10:30:00.000000+00:00"
                        updated_at: "2025-10-22T10:35:00.000000+00:00"
        '400':
          description: Session not in active state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              examples:
                notActive:
                  value:
                    success: false
                    message: "SESSION_NOT_ACTIVE"
        '404':
          description: Session not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              examples:
                notFound:
                  value:
                    success: false
                    message: "SESSION_NOT_FOUND"

  /api/games/sessions/{session_id}/resume:
    post:
      tags:
        - Game Sessions
      summary: Resume game session
      description: |
        Resume a paused game session. Returns the complete session object with current_state
        synced from the plugin.
