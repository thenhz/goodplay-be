                  maximum: 20
                  default: 8
                  example: 4
                game_config:
                  type: object
                  description: Optional game-specific configuration
                  additionalProperties: true
                  example: {"difficulty": "hard", "rounds": 10}
      responses:
        '200':
          description: Room created successfully
          content:
