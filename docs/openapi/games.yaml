  # GOO-60: Multiplayer Invitations & Notifications
  /api/multiplayer/rooms/{room_id}/invitations:
    post:
      tags:
        - Multiplayer Invitations
      summary: Send room invitation(s)
      description: |
        Send single or batch invitations to multiplayer room.

        **GOO-60 Features:**
        - Supports both single (`recipient_user_id`) and batch (`recipient_ids`) invitations
        - Rate limited to 10 calls per minute per user
        - Validates against blocked users
        - Validates room capacity
        - Emits real-time WebSocket events
        - Invitations expire after 15 minutes
      security:
        - bearerAuth: []
      parameters:
        - name: room_id
          in: path
          required: true
          schema:
            type: string
          description: Room ID to send invitations for
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  properties:
                    recipient_user_id:
                      type: string
                      description: Single recipient user ID
                  required:
                    - recipient_user_id
                - type: object
                  properties:
                    recipient_ids:
                      type: array
                      items:
                        type: string
                      maxItems: 10
                      description: List of recipient user IDs (max 10)
                  required:
                    - recipient_ids
            examples:
              single:
                summary: Single invitation
                value:
                  recipient_user_id: "user123"
              batch:
                summary: Batch invitations
                value:
                  recipient_ids: ["user1", "user2", "user3"]
      responses:
        '200':
          description: Invitation(s) sent successfully
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/SingleInvitationResponse'
                  - $ref: '#/components/schemas/BatchInvitationResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              examples:
                dataRequired:
                  value:
                    success: false
                    message: "DATA_REQUIRED"
                recipientRequired:
                  value:
                    success: false
                    message: "RECIPIENT_USER_ID_OR_IDS_REQUIRED"
                roomNotFound:
                  value:
                    success: false
                    message: "ROOM_NOT_FOUND"
                notInRoom:
                  value:
                    success: false
                    message: "NOT_IN_ROOM"
                roomNotAccepting:
                  value:
                    success: false
                    message: "ROOM_NOT_ACCEPTING_PLAYERS"
                userBlocked:
                  value:
                    success: false
                    message: "USER_BLOCKED"
                roomFull:
                  value:
                    success: false
                    message: "ROOM_FULL"
                alreadyInRoom:
                  value:
                    success: false
                    message: "ALREADY_IN_ROOM"
                invitationAlreadySent:
                  value:
                    success: false
                    message: "INVITATION_ALREADY_SENT"
                recipientListEmpty:
                  value:
                    success: false
                    message: "RECIPIENT_LIST_EMPTY"
                tooManyRecipients:
                  value:
                    success: false
                    message: "TOO_MANY_RECIPIENTS"
                noInvitationsSent:
                  value:
                    success: false
                    message: "NO_INVITATIONS_SENT"
                invitationCreationFailed:
                  value:
                    success: false
                    message: "INVITATION_CREATION_FAILED"
                sendInvitationError:
                  value:
                    success: false
                    message: "SEND_INVITATION_ERROR"
                batchInvitationError:
                  value:
                    success: false
                    message: "BATCH_INVITATION_ERROR"
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                success: false
                message: "RATE_LIMIT_EXCEEDED"

  /api/multiplayer/invitations:
    get:
      tags:
        - Multiplayer Invitations
      summary: Get user's invitations
      description: Retrieve all invitations received by the current user
