              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          session:
                            $ref: '#/components/schemas/GameSession'
              examples:
                ticTacToeResumed:
                  value:
                    success: true
                    message: "SESSION_RESUMED_SUCCESS"
                    data:
                      session:
                        session_id: "507f1f77bcf86cd799439011"
                        game_id: "tic_tac_toe"
                        user_id: "507f191e810c19729de860ea"
                        status: "active"
                        current_state:
                          board: [["X", "O", null], [null, "X", null], [null, null, "O"]]
                          current_player: "X"
                          game_mode: "vs_ai"
                          player_symbol: "X"
                          game_over: false
                          winner: null
                          is_draw: false
                          winning_line: null
                          move_count: 4
                        moves_count: 4
                        score: 0
                        credits_earned: 0
                        started_at: "2025-10-22T10:30:00.000000+00:00"
                        paused_at: "2025-10-22T10:35:00.000000+00:00"
                        resumed_at: "2025-10-22T10:40:00.000000+00:00"
                        created_at: "2025-10-22T10:30:00.000000+00:00"
                        updated_at: "2025-10-22T10:40:00.000000+00:00"
        '400':
