# GOO-60: Multiplayer Invitations & Notifications API Extension
# This file contains the OpenAPI additions for GOO-60
# Merge these paths and components into docs/openapi/games.yaml

paths:
  # Batch Invitations Endpoint (extends existing POST /api/multiplayer/rooms/{roomId}/invitations)
  /api/multiplayer/rooms/{roomId}/invitations:
    post:
      tags:
        - Multiplayer Invitations
      summary: Send room invitation(s)
      description: |
        Send single or batch invitations to multiplayer room.

        **GOO-60 Features:**
        - Supports both single (`recipient_user_id`) and batch (`recipient_ids`) invitations
        - Rate limited to 10 calls per minute per user
        - Validates against blocked users
        - Validates room capacity
        - Emits real-time WebSocket events
        - Invitations expire after 15 minutes
      security:
        - bearerAuth: []
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: string
          description: Room ID to send invitations for
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  properties:
                    recipient_user_id:
                      type: string
                      description: Single recipient user ID
                  required:
                    - recipient_user_id
                - type: object
                  properties:
                    recipient_ids:
                      type: array
                      items:
                        type: string
                      maxItems: 10
                      description: List of recipient user IDs (max 10)
                  required:
                    - recipient_ids
            examples:
              single:
                summary: Single invitation
                value:
                  recipient_user_id: "user123"
              batch:
                summary: Batch invitations
                value:
                  recipient_ids: ["user1", "user2", "user3"]
      responses:
        '200':
          description: Invitation(s) sent successfully
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/SingleInvitationResponse'
                  - $ref: '#/components/schemas/BatchInvitationResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                roomNotFound:
                  value:
                    message: "ROOM_NOT_FOUND"
                notInRoom:
                  value:
                    message: "NOT_IN_ROOM"
                userBlocked:
                  value:
                    message: "USER_BLOCKED"
                roomFull:
                  value:
                    message: "ROOM_FULL"
                alreadyInRoom:
                  value:
                    message: "ALREADY_IN_ROOM"
                invitationAlreadySent:
                  value:
                    message: "INVITATION_ALREADY_SENT"
                tooManyRecipients:
                  value:
                    message: "TOO_MANY_RECIPIENTS"
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: "RATE_LIMIT_EXCEEDED"

  # Delete Invitation (Cancel)
  /api/multiplayer/invitations/{invitationId}:
    delete:
      tags:
        - Multiplayer Invitations
      summary: Cancel invitation
      description: |
        Cancel a pending invitation (sender only).

        **GOO-60:** Allows sender to revoke invitations before they are accepted/declined.
      security:
        - bearerAuth: []
      parameters:
        - name: invitationId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Invitation cancelled successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                message: "INVITATION_CANCELLED_SUCCESS"
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                notFound:
                  value:
                    message: "INVITATION_NOT_FOUND"
                notSender:
                  value:
                    message: "NOT_INVITATION_SENDER"
                alreadyProcessed:
                  value:
                    message: "INVITATION_ALREADY_PROCESSED"

  # Social-Multiplayer Integration Endpoints
  /api/social/friends/online:
    get:
      tags:
        - Social Multiplayer Integration
      summary: Get online friends
      description: |
        Get list of friends currently connected to multiplayer system.

        **GOO-60:** Shows which friends are online and available for multiplayer.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Online friends retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          friends:
                            type: array
                            items:
                              $ref: '#/components/schemas/OnlineFriend'
                          count:
                            type: integer

  /api/social/friends/{friendId}/current-room:
    get:
      tags:
        - Social Multiplayer Integration
      summary: Get friend's current room
      description: |
        Get friend's current multiplayer room if they are in one.

        **GOO-60:** Shows room details and whether you can join.
      security:
        - bearerAuth: []
      parameters:
        - name: friendId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Friend room info retrieved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        oneOf:
                          - $ref: '#/components/schemas/FriendInRoom'
                          - $ref: '#/components/schemas/FriendNotInRoom'

  /api/social/friends/{friendId}/invite-to-room:
    post:
      tags:
        - Social Multiplayer Integration
      summary: Invite friend to your room
      description: |
        Shortcut to invite a friend to your current multiplayer room.

        **GOO-60:** Quick way to invite friends without specifying room ID.
      security:
        - bearerAuth: []
      parameters:
        - name: friendId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                room_id:
                  type: string
                  description: Optional room ID (uses current room if not provided)
      responses:
        '200':
          description: Invitation sent successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SingleInvitationResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                notInRoom:
                  value:
                    message: "NOT_IN_ANY_ROOM"

# Components
components:
  schemas:
    # Invitation Model (Enhanced for GOO-60)
    RoomInvitation:
      type: object
      properties:
        invitation_id:
          type: string
          example: "inv_123456"
        room_id:
          type: string
          example: "room_789"
        room_code:
          type: string
          example: "ABC123"
          description: "GOO-60: Room join code for easier access"
        game_id:
          type: string
          example: "memory_game"
        game_name:
          type: string
          example: "Memory Game"
          description: "GOO-60: Human-readable game name"
        sender_user_id:
          type: string
          example: "user_sender"
        recipient_user_id:
          type: string
          example: "user_recipient"
        status:
          type: string
          enum: [pending, accepted, declined, expired]
          example: "pending"
        created_at:
          type: string
          format: date-time
          example: "2025-10-07T10:00:00.000000+00:00"
        expires_at:
          type: string
          format: date-time
          example: "2025-10-07T10:15:00.000000+00:00"
          description: "GOO-60: Expires 15 minutes after creation"
        accepted_at:
          type: string
          format: date-time
          nullable: true
        declined_at:
          type: string
          format: date-time
          nullable: true
        metadata:
          type: object
          additionalProperties: true

    # Response Schemas
    SingleInvitationResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                invitation:
                  $ref: '#/components/schemas/RoomInvitation'

    BatchInvitationResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                sent:
                  type: array
                  items:
                    type: object
                    properties:
                      recipient_id:
                        type: string
                      invitation_id:
                        type: string
                failed:
                  type: array
                  items:
                    type: object
                    properties:
                      recipient_id:
                        type: string
                      reason:
                        type: string
                        enum:
                          - CANNOT_INVITE_SELF
                          - ALREADY_IN_ROOM
                          - ROOM_FULL
                          - USER_BLOCKED
                          - INVITATION_ALREADY_SENT
                          - INVITATION_CREATION_FAILED
                total_requested:
                  type: integer
                sent_count:
                  type: integer
                failed_count:
                  type: integer

    OnlineFriend:
      type: object
      properties:
        user_id:
          type: string
        display_name:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        is_in_room:
          type: boolean
        room_id:
          type: string
          nullable: true

    FriendInRoom:
      type: object
      properties:
        in_room:
          type: boolean
          example: true
        room:
          $ref: '#/components/schemas/GameRoom'
        is_joinable:
          type: boolean
        reason:
          type: string
          nullable: true
          enum:
            - ROOM_NOT_ACCEPTING_PLAYERS
            - ROOM_FULL
            - ALREADY_IN_ROOM

    FriendNotInRoom:
      type: object
      properties:
        in_room:
          type: boolean
          example: false

    SuccessResponse:
      type: object
      properties:
        message:
          type: string
        data:
          type: object

    ErrorResponse:
      type: object
      properties:
        message:
          type: string
        error:
          type: string
          nullable: true

# WebSocket Events (GOO-60)
websocketEvents:
  invitation_received:
    description: |
      Emitted to recipient when they receive a new invitation.

      **Client listens on:** `/multiplayer` namespace, `invitation_received` event
    payload:
      type: object
      properties:
        invitation:
          $ref: '#/components/schemas/RoomInvitation'
        message:
          type: string
          example: "NEW_INVITATION_RECEIVED"
        timestamp:
          type: string
          format: date-time
    example:
      invitation:
        invitation_id: "inv_123"
        room_id: "room_456"
        room_code: "ABC123"
        game_id: "memory_game"
        sender_user_id: "user_789"
        expires_at: "2025-10-07T10:15:00.000000+00:00"
      message: "NEW_INVITATION_RECEIVED"
      timestamp: "2025-10-07T10:00:00.123456+00:00"

  invitation_accepted:
    description: |
      Emitted to sender when their invitation is accepted.

      **Client listens on:** `/multiplayer` namespace, `invitation_accepted` event
    payload:
      type: object
      properties:
        invitation:
          type: object
          properties:
            invitation_id:
              type: string
            room_id:
              type: string
            accepted_by:
              type: string
        message:
          type: string
          example: "INVITATION_WAS_ACCEPTED"
        timestamp:
          type: string
          format: date-time

  invitation_declined:
    description: |
      Emitted to sender when their invitation is declined.

      **Client listens on:** `/multiplayer` namespace, `invitation_declined` event
    payload:
      type: object
      properties:
        invitation:
          type: object
          properties:
            invitation_id:
              type: string
            declined_by:
              type: string
        message:
          type: string
          example: "INVITATION_WAS_DECLINED"
        timestamp:
          type: string
          format: date-time

  invitation_expired:
    description: |
      Emitted to recipient when an invitation expires (after 15 minutes).

      **Client listens on:** `/multiplayer` namespace, `invitation_expired` event
    payload:
      type: object
      properties:
        invitation_id:
          type: string
        message:
          type: string
          example: "INVITATION_EXPIRED"
        timestamp:
          type: string
          format: date-time

  friend_joined_room:
    description: |
      Emitted when a friend joins a multiplayer room.

      **Client listens on:** `/multiplayer` namespace, `friend_joined_room` event
    payload:
      type: object
      properties:
        friend:
          type: object
          properties:
            user_id:
              type: string
            display_name:
              type: string
        room:
          type: object
          properties:
            room_id:
              type: string
            room_code:
              type: string
            game_id:
              type: string
        message:
          type: string
          example: "FRIEND_JOINED_ROOM"
        timestamp:
          type: string
          format: date-time

# Response Message Constants (GOO-60)
responseConstants:
  invitations:
    # Success messages
    INVITATION_SENT_SUCCESS: "Invitation sent successfully"
    BATCH_INVITATIONS_SENT: "Batch invitations sent (partial success possible)"
    INVITATION_ACCEPTED_SUCCESS: "Invitation accepted successfully"
    INVITATION_DECLINED_SUCCESS: "Invitation declined successfully"
    INVITATION_CANCELLED_SUCCESS: "Invitation cancelled successfully"
    INVITATIONS_RETRIEVED_SUCCESS: "Invitations retrieved successfully"

    # Error messages
    INVITATION_NOT_FOUND: "Invitation not found"
    INVITATION_ALREADY_SENT: "Invitation already sent to this user"
    INVITATION_ALREADY_PROCESSED: "Invitation already accepted or declined"
    INVITATION_EXPIRED: "Invitation has expired"
    INVITATION_CREATION_FAILED: "Failed to create invitation"
    NOT_INVITATION_SENDER: "You are not the sender of this invitation"
    NOT_INVITATION_RECIPIENT: "You are not the recipient of this invitation"
    RECIPIENT_USER_ID_REQUIRED: "Recipient user ID is required"
    RECIPIENT_USER_ID_OR_IDS_REQUIRED: "Either recipient_user_id or recipient_ids is required"
    RECIPIENT_LIST_EMPTY: "Recipient list cannot be empty"
    TOO_MANY_RECIPIENTS: "Too many recipients (max 10)"
    NO_INVITATIONS_SENT: "No invitations were sent"

    # Validation errors
    USER_BLOCKED: "Cannot send invitation to blocked user"
    ALREADY_IN_ROOM: "User is already in the room"
    ROOM_FULL: "Room is full"
    ROOM_NOT_ACCEPTING_PLAYERS: "Room is not accepting players"
    NOT_IN_ROOM: "You are not in this room"
    NOT_IN_ANY_ROOM: "You are not currently in any room"

    # Rate limiting
    RATE_LIMIT_EXCEEDED: "Rate limit exceeded (max 10 invitations per minute)"

  socialMultiplayer:
    ONLINE_FRIENDS_RETRIEVED: "Online friends retrieved successfully"
    FRIEND_NOT_ONLINE: "Friend is not currently online"
    FRIEND_NOT_IN_ROOM: "Friend is not currently in a room"
    FRIEND_ROOM_RETRIEVED: "Friend's room information retrieved"
